# Para correr todo en una computadora (desarrollo o prueba local).
# En el VPS se usa Easypanel, no este archivo: ver docs/DESPLIEGUE.md.
#
#   cp .env.example .env    # y llena SESSION_SECRET y OWNER_EMAIL
#   docker compose up --build
#   abre http://localhost:3000

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rnr
      POSTGRES_PASSWORD: rnr
      POSTGRES_DB: rnr
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnr"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://rnr:rnr@db:5432/rnr
      PUBLIC_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - datos:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  datos:
